[package]
name = "drafty"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small whiteboard for sketching explanations"
license = "GPL-3.0-or-later"

[dependencies]
ab_glyph = "0.2.32"
arboard = { version = "3.7.0", default-features = false, features = ["image-data", "wayland-data-control"] }
base64 = "0.23.1"
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "clipboard"] }
egui = { version = "0.37.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd", "png-format"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
